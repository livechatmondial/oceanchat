```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OceanChat</title>

    <link rel="stylesheet" href="./style.css?v=20260906">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body>

<!-- ==============================
     CONNEXION
     ============================== -->

<section id="loginSection">

    <div class="login-card">

        <h1>🌊 OceanChat</h1>

        <p class="subtitle">
            Rencontrez de nouvelles personnes et discutez en ligne.
        </p>

        <form id="profileForm">

            <div class="form-group">
                <label for="pseudo">Pseudo</label>
                <input
                    id="pseudo"
                    type="text"
                    placeholder="Votre pseudo"
                    maxlength="30"
                    required
                >
            </div>

            <div class="form-group">
                <label for="age">Âge</label>
                <input
                    id="age"
                    type="number"
                    min="18"
                    max="120"
                    placeholder="Votre âge"
                    required
                >
            </div>

            <div class="form-group">
                <label for="sexe">Sexe</label>
                <select id="sexe" required>
                    <option value="">Choisir</option>
                    <option value="Homme">Homme</option>
                    <option value="Femme">Femme</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pays">Pays</label>
                <select id="pays" required>
                    <option value="">Choisir votre pays</option>
                    <option value="Canada">🇨🇦 Canada</option>
                    <option value="France">🇫🇷 France</option>
                    <option value="Belgique">🇧🇪 Belgique</option>
                    <option value="Suisse">🇨🇭 Suisse</option>
                    <option value="Maroc">🇲🇦 Maroc</option>
                    <option value="Algérie">🇩🇿 Algérie</option>
                    <option value="Tunisie">🇹🇳 Tunisie</option>
                    <option value="Sénégal">🇸🇳 Sénégal</option>
                    <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
                    <option value="États-Unis">🇺🇸 États-Unis</option>
                    <option value="Autre">🌎 Autre</option>
                </select>
            </div>

            <button
                type="submit"
                class="btn-connect"
            >
                🌊 Connecter
            </button>

        </form>

        <div class="signup-footer">
            Nouveau sur OceanChat ?
            <a href="inscription.html">Créer un compte</a>
        </div>

    </div>

</section>


<!-- ==============================
     APPLICATION
     ============================== -->

<section id="chatSection" style="display:none;">

    <!-- HEADER -->

    <header class="chat-header">

        <div class="brand">
            <h1>🌊 OceanChat</h1>
        </div>

        <div class="header-user">

            <span class="online-indicator"></span>

            <span>
                <strong id="onlineCount">0</strong>
                en ligne
            </span>

            <button
                id="logoutBtn"
                class="btn-logout"
                type="button"
            >
                Déconnexion
            </button>

        </div>

    </header>


    <!-- ==========================
         CONTENU
         ========================== -->

    <div class="chat-layout">


        <!-- ========================
             UTILISATEURS À GAUCHE
             ======================== -->

        <aside class="users-sidebar">

            <div class="users-title">

                <h2>👥 Utilisateurs</h2>

                <p>
                    Cliquez sur une personne
                    pour discuter en privé.
                </p>

            </div>

            <div id="usersList"></div>

        </aside>


        <!-- ========================
             SALON PRINCIPAL
             ======================== -->

        <main class="public-chat">

            <div class="chat-title">

                <h2>💬 Salon principal</h2>

                <span>
                    Discutez avec tout le monde
                </span>

            </div>


            <!-- MESSAGES PUBLICS -->

            <div id="messages"></div>


            <!-- ENVOI PUBLIC -->

            <form
                id="messageForm"
                class="message-form"
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Écrire un message..."
                    autocomplete="off"
                >

                <button
                    id="sendMessage"
                    type="submit"
                >
                    Envoyer
                </button>

            </form>

        </main>

    </div>


    <!-- ==============================
         FENÊTRE PRIVÉE
         ============================== -->

    <div
        id="privateModal"
        class="private-window"
    >

        <div class="private-header">

            <div class="private-user-title">

                <span class="private-online-dot"></span>

                <h3 id="privateTitle">
                    Discussion privée
                </h3>

            </div>

            <div class="private-controls">

                <button
                    id="minimizePrivate"
                    type="button"
                    title="Réduire"
                >
                    −
                </button>

                <button
                    id="closePrivate"
                    type="button"
                    title="Fermer"
                >
                    ×
                </button>

            </div>

        </div>


        <!-- MESSAGES PRIVÉS -->

        <div id="privateMessages"></div>


        <!-- ENVOI PRIVÉ -->

        <form
            id="privateMessageForm"
            class="private-form"
        >

            <input
                id="privateMessageInput"
                type="text"
                placeholder="Message privé..."
                autocomplete="off"
            >

            <button
                id="sendPrivateMessage"
                type="submit"
            >
                Envoyer
            </button>

        </form>

    </div>


    <!-- BARRE DES CONVERSATIONS RÉDUITES -->

    <div
        id="privateChatsBar"
        class="private-chats-bar"
    ></div>

</section>


<script src="script.js"></script>

</body>
</html>
```
