```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OceanChat 🌊</title>

  <meta name="description" content="OceanChat - Chat et rencontres en ligne">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       PAGE DE CONNEXION
  ========================== -->

  <section id="loginSection">

    <h1>🌊 OceanChat</h1>

    <p>Rencontrez de nouvelles personnes et discutez en ligne.</p>

    <div id="configError"
         style="display:none; padding:15px; margin:15px 0; background:#ffe5e5; color:#b00020; border-radius:10px;">
    </div>

    <form id="profileForm">

      <label for="pseudo">Pseudo</label>
      <input
        id="pseudo"
        name="pseudo"
        type="text"
        placeholder="Votre pseudo"
        maxlength="30"
        required
      >

      <label for="age">Âge</label>
      <input
        id="age"
        name="age"
        type="number"
        min="18"
        max="120"
        placeholder="Votre âge"
        required
      >

      <label for="sexe">Sexe</label>
      <select id="sexe" name="sexe" required>
        <option value="">Choisir</option>
        <option value="Homme">Homme</option>
        <option value="Femme">Femme</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="pays">Pays</label>
      <select id="pays" name="pays" required>
        <option value="">Choisir votre pays</option>
        <option value="Canada">🇨🇦 Canada</option>
        <option value="France">🇫🇷 France</option>
        <option value="Belgique">🇧🇪 Belgique</option>
        <option value="Suisse">🇨🇭 Suisse</option>
        <option value="États-Unis">🇺🇸 États-Unis</option>
        <option value="Maroc">🇲🇦 Maroc</option>
        <option value="Algérie">🇩🇿 Algérie</option>
        <option value="Tunisie">🇹🇳 Tunisie</option>
        <option value="Sénégal">🇸🇳 Sénégal</option>
        <option value="Côte d'Ivoire">🇨🇮 Côte d'Ivoire</option>
        <option value="Autre">🌍 Autre</option>
      </select>

      <button type="submit" class="btn-connect">
        🌊 Connecter
      </button>

    </form>

    <p>
      Pas encore inscrit ?
      <a href="inscription.html">Créer un compte</a>
    </p>

  </section>


  <!-- =========================
       ESPACE CHAT
  ========================== -->

  <section id="chatSection" style="display:none;">

    <header>

      <h1>🌊 OceanChat</h1>

      <div>
        👥 En ligne :
        <span id="onlineCount">0</span>
      </div>

      <button id="logoutBtn" type="button">
        Déconnexion
      </button>

    </header>


    <!-- PROFIL CONNECTÉ -->

    <div id="currentProfile">

      <strong id="currentPseudo"></strong>

      <span id="currentAge"></span>

      <span id="currentSexe"></span>

      <span id="currentPays"></span>

    </div>


    <!-- UTILISATEURS EN LIGNE -->

    <aside>

      <h2>👥 Utilisateurs en ligne</h2>

      <div id="usersList"></div>

    </aside>


    <!-- CHAT PUBLIC -->

    <main>

      <h2>💬 Discussion publique</h2>

      <div id="messages"></div>

      <form id="messageForm">

        <input
          id="messageInput"
          type="text"
          placeholder="Écrire un message..."
          autocomplete="off"
          maxlength="500"
          required
        >

        <button type="submit">
          Envoyer
        </button>

      </form>

    </main>

  </section>


  <!-- =========================
       CHAT PRIVÉ
  ========================== -->

  <div
    id="privateModal"
    style="display:none;"
  >

    <div>

      <h2 id="privateTitle">
        💬 Message privé
      </h2>

      <button
        id="closePrivateBtn"
        type="button"
      >
        ✕
      </button>

      <div id="privateMessages"></div>

      <form id="privateMessageForm">

        <input
          id="privateMessageInput"
          type="text"
          placeholder="Votre message..."
          autocomplete="off"
          maxlength="500"
          required
        >

        <button type="submit">
          Envoyer
        </button>

      </form>

    </div>

  </div>


  <!-- =========================
       SUPABASE
       NE PAS CHANGER L'ORDRE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase-config.js"></script>

  <script>

    console.log("🌊 OceanChat : démarrage...");

    const configError = document.getElementById("configError");

    if (!window.supabase) {

      console.error("❌ La bibliothèque Supabase n'est pas chargée.");

      configError.style.display = "block";

      configError.textContent =
        "❌ Supabase ne se charge pas. Vérifie ta connexion Internet.";

    }
    else if (
      !window.OCEANCHAT_SUPABASE_URL ||
      !window.OCEANCHAT_SUPABASE_KEY
    ) {

      console.error("❌ supabase-config.js n'est pas correctement configuré.");

      configError.style.display = "block";

      configError.textContent =
        "❌ Configuration Supabase introuvable. Vérifie supabase-config.js.";

    }
    else {

      console.log("✅ Configuration Supabase détectée.");

    }

  </script>


  <!-- SCRIPT PRINCIPAL -->

  <script src="script.js"></script>

</body>
</html>
```
