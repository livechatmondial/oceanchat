<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="OceanChat - Chat en ligne et rencontres"
  >

  <title>🌊 OceanChat</title>

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="./style.css?v=20260906"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuration Supabase -->
  <script src="./supabase-config.js"></script>
</head>

<body>

  <!-- =========================================
       CONNEXION
  ========================================== -->

  <section id="loginSection">

    <div class="login-box">

      <h1>🌊 OceanChat</h1>

      <p>
        Rencontre de nouvelles personnes et discute en ligne.
      </p>

      <form id="profileForm">

        <label for="pseudo">
          Pseudo
        </label>

        <input
          type="text"
          id="pseudo"
          name="pseudo"
          placeholder="Ton pseudo"
          maxlength="30"
          autocomplete="nickname"
          required
        >

        <label for="age">
          Âge
        </label>

        <input
          type="number"
          id="age"
          name="age"
          placeholder="Ton âge"
          min="18"
          max="100"
          required
        >

        <label for="sexe">
          Sexe
        </label>

        <select
          id="sexe"
          name="sexe"
          required
        >
          <option value="">
            Choisir
          </option>

          <option value="Homme">
            Homme
          </option>

          <option value="Femme">
            Femme
          </option>

          <option value="Autre">
            Autre
          </option>
        </select>

        <label for="pays">
          Pays
        </label>

        <input
          type="text"
          id="pays"
          name="pays"
          placeholder="Ton pays"
          maxlength="50"
          autocomplete="country-name"
          required
        >

        <button
          type="submit"
          id="connectBtn"
        >
          🚀 Connecter
        </button>

      </form>

    </div>

  </section>


  <!-- =========================================
       APPLICATION CHAT
  ========================================== -->

  <section
    id="chatSection"
    style="display: none;"
  >

    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="chat-header">

      <h1>
        🌊 OceanChat
      </h1>

      <div class="online-status">

        <span class="online-dot"></span>

        <span>
          <span id="onlineCount">0</span>
          en ligne
        </span>

      </div>

      <button
        type="button"
        id="logoutBtn"
      >
        Déconnexion
      </button>

    </header>


    <!-- =====================================
         CONTENU PRINCIPAL
    ====================================== -->

    <div class="chat-layout">


      <!-- ===================================
           LISTE DES UTILISATEURS
      ==================================== -->

      <aside class="users-sidebar">

        <h2>
          👥 Utilisateurs
        </h2>

        <div id="usersList">

          <div class="empty-users">
            Aucun autre utilisateur en ligne.
          </div>

        </div>

      </aside>


      <!-- ===================================
           SALON PUBLIC
      ==================================== -->

      <main class="public-chat">

        <div class="public-chat-header">

          <h2>
            💬 Salon principal
          </h2>

        </div>


        <!-- Messages publics -->

        <div id="messages"></div>


        <!-- Formulaire public -->

        <form
          id="messageForm"
          class="message-form"
        >

          <input
            type="text"
            id="messageInput"
            placeholder="Écris ton message..."
            autocomplete="off"
            maxlength="1000"
          >

          <button
            type="submit"
            id="sendMessage"
          >
            Envoyer
          </button>

        </form>

      </main>

    </div>


    <!-- =====================================
         FENÊTRE DE CHAT PRIVÉ
    ====================================== -->

    <div
      id="privateModal"
      class="private-window"
      style="display: none;"
    >

      <!-- En-tête privé -->

      <div class="private-header">

        <div id="privateTitle">
          💬 Conversation privée
        </div>

        <div class="private-controls">

          <button
            type="button"
            id="minimizePrivate"
            aria-label="Réduire"
            title="Réduire"
          >
            −
          </button>

          <button
            type="button"
            id="closePrivate"
            aria-label="Fermer"
            title="Fermer"
          >
            ×
          </button>

        </div>

      </div>


      <!-- Messages privés -->

      <div id="privateMessages"></div>


      <!-- Formulaire privé -->

      <form
        id="privateMessageForm"
        class="private-form"
      >

        <input
          type="text"
          id="privateMessageInput"
          placeholder="Message privé..."
          autocomplete="off"
          maxlength="1000"
        >

        <button
          type="submit"
          id="sendPrivateMessage"
        >
          Envoyer
        </button>

      </form>

    </div>


    <!-- =====================================
         CHATS PRIVÉS RÉDUITS
    ====================================== -->

    <div
      id="privateChatsBar"
      aria-label="Conversations privées"
    ></div>


    <!-- =====================================
         PIED DE PAGE
    ====================================== -->

    <footer style="display: none;">

      <a href="./inscription.html">
        Créer un compte
      </a>

    </footer>

  </section>


  <!-- =========================================
       SCRIPT OCEANCHAT
  ========================================== -->

  <script src="./script.js?v=20260906"></script>

</body>
</html>
