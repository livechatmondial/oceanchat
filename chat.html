<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat - Chat International</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <a href="recherche.html" class="back">←</a>

            <div class="chat-user">
                <div class="chat-avatar">👩</div>

                <div>
                    <h2>Marie</h2>
                    <span>🟢 En ligne</span>
                </div>
            </div>

            <button class="more">⋮</button>
        </div>

        <div class="messages">

            <div class="message received">
                Salut 👋
            </div>

            <div class="message received">
                Comment vas-tu ?
            </div>

            <div class="message sent">
                Salut Marie 😊 Je vais très bien !
            </div>

            <div class="message sent">
                Tu viens de quel pays ?
            </div>

        </div>

        <div class="chat-input">

            <button class="emoji">
                😊
            </button>

            <input
                type="text"
                placeholder="Écris ton message..."
            >

            <button class="send">
                ➤
            </button>

        </div>

    </div>

</body>

</html>
